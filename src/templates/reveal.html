{% extends 'base.html' %}
{% block content %}
<h2 class="text-center">Reveal Secret Image</h2>

<form method="POST" enctype="multipart/form-data" class="d-flex flex-column align-items-center">
  <div class="p-3">
    <label><b>Stego Image</b></label><br>
    <input type="file" name="stego" class="form-control-file" required onchange="previewImage(event, 'stego-preview')">
    <img id="stego-preview" src="#" alt="Stego Preview" class="img-fluid mt-2" style="max-height: 200px; display:none;">
  </div>

  <button type="submit" class="btn btn-primary mt-3">Reveal</button>
</form>

{% if revealed_url %}
<hr>
<h4 class="text-center">Revealed Secret</h4>
<div class="text-center">
  <img src="{{ revealed_url }}" class="img-fluid mt-2" style="max-height: 300px;">
  <br><br>
  <a href="{{ revealed_url }}" download="revealed.png" class="btn btn-success mt-2 mb-4">Download Revealed Image</a>
</div>
{% endif %}

<script>
function previewImage(event, id) {
    var reader = new FileReader();
    reader.onload = function(){
        var output = document.getElementById(id);
        output.src = reader.result;
        output.style.display = 'block';
    }
    reader.readAsDataURL(event.target.files[0]);
}
</script>
{% endblock %}
